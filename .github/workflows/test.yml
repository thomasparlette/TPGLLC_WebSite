name: Runner Test 5

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Runner Information
        shell: powershell
        run: | 
          hostname
          whoami
          git --version
          dotnet --info

      - name: Build Solution
        shell: powershell
        run: dotnet build