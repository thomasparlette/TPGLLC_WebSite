name: Deploy Production Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_PATH: TPGLLC_WebSite/TPGLLC_WebSite.csproj

  PUBLISH_DIR: D:\Deploy\Artifacts\publish
  WEBSITE_DIR: D:\Websites\TPGLLC\Published

  BACKUP_DIR: D:\Deploy\Backups
  RELEASE_DIR: D:\Deploy\Releases
  LOG_DIR: D:\Deploy\Logs

  HEALTHCHECK_URL: http://localhost/health

  KEEP_RELEASES: 10
  LOG_RETENTION_DAYS: 30
  BACKUP_RETENTION_DAYS: 30

  COMMIT_SHA: ${{ github.sha }}
  BRANCH_NAME: ${{ github.ref_name }}
  RUNNER_NAME: ${{ runner.name }}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Runner Information
        shell: powershell
        run: |
          Write-Host "Computer:"
          hostname

          Write-Host ""
          Write-Host "User:"
          whoami

          Write-Host ""
          git --version

          Write-Host ""
          dotnet --info

      - name: Prepare Publish Folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:PUBLISH_DIR | Out-Null
          Remove-Item -Path (Join-Path $env:PUBLISH_DIR '*') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build Website
        shell: powershell
        run: |
          dotnet publish $env:PROJECT_PATH -c Release -o $env:PUBLISH_DIR

      - name: Deploy Website
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\Deploy\Scripts\Deploy.ps1" `
            -WebsitePath $env:WEBSITE_DIR `
            -PublishPath $env:PUBLISH_DIR `
            -BackupRoot $env:BACKUP_DIR `
            -ReleaseRoot $env:RELEASE_DIR `
            -LogRoot $env:LOG_DIR `
            -HealthCheckUrl $env:HEALTHCHECK_URL `
            -KeepReleases $env:KEEP_RELEASES `
            -LogRetentionDays $env:LOG_RETENTION_DAYS `
            -BackupRetentionDays $env:BACKUP_RETENTION_DAYS `
            -CommitSha $env:COMMIT_SHA `
            -BranchName $env:BRANCH_NAME `
            -RunnerName $env:RUNNER_NAME

      - name: Deployment Summary
        if: always()
        shell: powershell
        run: |
          $Summary = $env:GITHUB_STEP_SUMMARY

          Add-Content $Summary "# Deployment Summary"
          Add-Content $Summary ""

          Add-Content $Summary "**Repository**"
          Add-Content $Summary ": $env:GITHUB_REPOSITORY"
          Add-Content $Summary ""

          Add-Content $Summary "**Branch**"
          Add-Content $Summary ": $env:BRANCH_NAME"
          Add-Content $Summary ""

          Add-Content $Summary "**Commit**"
          Add-Content $Summary ": $env:COMMIT_SHA"
          Add-Content $Summary ""

          Add-Content $Summary "**Runner**"
          Add-Content $Summary ": $env:RUNNER_NAME"
          Add-Content $Summary ""

          Add-Content $Summary "**Status**"
          Add-Content $Summary ": ${{ job.status }}"
          Add-Content $Summary ""

          $LatestLog = Get-ChildItem `
              $env:LOG_DIR `
              -Filter "*.log" `
              -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

          if ($LatestLog)
          {
              Add-Content $Summary "Latest Log"
              Add-Content $Summary ""
              Add-Content $Summary '```text'

              Get-Content $LatestLog.FullName -Tail 50 |
                  ForEach-Object {
                      Add-Content $Summary $_
                  }

              Add-Content $Summary '```'
          }
          else
          {
              Add-Content $Summary ""
              Add-Content $Summary "No deployment log found."
          }

      - name: Upload Deployment Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeploymentLogs
          path: |
            D:\Deploy\Logs\*.log
          if-no-files-found: warn
          retention-days: 14