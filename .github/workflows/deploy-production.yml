name: Deploy Production Website

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run EF migrations on the target environment
        type: boolean
        required: false
        default: true
      run_bootstrapper:
        description: Run the development/production bootstrapper
        type: boolean
        required: false
        default: false
      run_vehicle_importer:
        description: Run the vehicle importer
        type: boolean
        required: false
        default: false
      force_vehicle_importer:
        description: Force the vehicle importer even if it already ran
        type: boolean
        required: false
        default: false
      restart_iis:
        description: Restart IIS after deployment
        type: boolean
        required: false
        default: true
      skip_health_check:
        description: Skip the health check
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_PATH: TPGLLC.Web/TPGLLC.Web.csproj
  PUBLISH_DIR: D:\Deploy\Artifacts\publish
  WEBSITE_DIR: D:\Websites\TPGLLC\Published
  BACKUP_DIR: D:\Deploy\Backups
  RELEASE_DIR: D:\Deploy\Releases
  LOG_DIR: D:\Deploy\Logs
  HEALTHCHECK_URL: http://localhost/health
  COMMIT_SHA: ${{ github.sha }}
  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Runner Information
        shell: pwsh
        run: |
          Write-Host "Computer:"
          hostname

          Write-Host ""
          Write-Host "User:"
          whoami

          Write-Host ""
          git --version

          Write-Host ""
          dotnet --info

      - name: Prepare Publish Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:PUBLISH_DIR | Out-Null
          Remove-Item -Path (Join-Path $env:PUBLISH_DIR '*') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Find Solution File
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.slnx -Recurse | Select-Object FullName

      - name: Restore
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.slnx -Recurse | Select-Object -First 1
          if (-not $sln) { throw "No solution file found." }
          Write-Host "Using solution: $($sln.FullName)"
          dotnet restore $sln.FullName
      
      - name: Restore .NET Tools
        shell: pwsh
        run: |
          dotnet tool restore
      
      - name: Build Solution
        shell: pwsh
        run: |
          dotnet build TPGLLC.sln -c Release --no-restore    

      - name: Publish Website
        shell: pwsh
        run: |
          dotnet publish TPGLLC.Web/TPGLLC.Web.csproj -c Release -o $env:PUBLISH_DIR --no-build

      - name: Deploy Website
        shell: pwsh
        env:
          RUN_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations || false }}
          RUN_BOOTSTRAPPER: ${{ github.event_name == 'workflow_dispatch' && inputs.run_bootstrapper || false }}
          RUN_VEHICLE_IMPORTER: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vehicle_importer || false }}
          FORCE_VEHICLE_IMPORTER: ${{ github.event_name == 'workflow_dispatch' && inputs.force_vehicle_importer || false }}
          RESTART_IIS: ${{ github.event_name == 'workflow_dispatch' && inputs.restart_iis || true }}
          SKIP_HEALTH_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_health_check || false }}
        run: |
          function To-Bool 
          {
            param([object]$Value)
            if ($null -eq $Value) { return $false }
            if ($Value -is [bool]) { return $Value }
            return [System.Convert]::ToBoolean($Value)
          }

          $runMigrations = To-Bool $env:RUN_MIGRATIONS
          $runBootstrapper = To-Bool $env:RUN_BOOTSTRAPPER
          $runVehicleImporter = To-Bool $env:RUN_VEHICLE_IMPORTER
          $forceVehicleImporter = To-Bool $env:FORCE_VEHICLE_IMPORTER
          $restartIis = To-Bool $env:RESTART_IIS
          $skipHealthCheck = To-Bool $env:SKIP_HEALTH_CHECK

          & "$env:GITHUB_WORKSPACE\Deploy\Scripts\Deploy.ps1" `
            -WebsitePath $env:WEBSITE_DIR `
            -PublishPath $env:PUBLISH_DIR `
            -BackupRoot $env:BACKUP_DIR `
            -ReleaseRoot $env:RELEASE_DIR `
            -LogRoot $env:LOG_DIR `
            -HealthCheckUrl $env:HEALTHCHECK_URL `
            -CommitSha $env:COMMIT_SHA `
            -BranchName $env:BRANCH_NAME `
            -RunnerName $env:COMPUTERNAME `
            -RunMigrations:$runMigrations `
            -RunBootstrapper:$runBootstrapper `
            -RunVehicleImporter:$runVehicleImporter `
            -ForceVehicleImporter:$forceVehicleImporter `
            -RestartIIS:$restartIis `
            -SkipHealthCheck:$skipHealthCheck

      - name: Deployment Summary
        if: always()
        shell: pwsh
        run: |
          $Summary = $env:GITHUB_STEP_SUMMARY

          Add-Content $Summary "# Deployment Summary"
          Add-Content $Summary ""

          Add-Content $Summary "**Repository**"
          Add-Content $Summary ": $env:GITHUB_REPOSITORY"
          Add-Content $Summary ""

          Add-Content $Summary "**Branch**"
          Add-Content $Summary ": $env:BRANCH_NAME"
          Add-Content $Summary ""

          Add-Content $Summary "**Commit**"
          Add-Content $Summary ": $env:COMMIT_SHA"
          Add-Content $Summary ""

          Add-Content $Summary "**Runner**"
          Add-Content $Summary ": $env:RUNNER_NAME"
          Add-Content $Summary ""

          Add-Content $Summary "**Status**"
          Add-Content $Summary ": ${{ job.status }}"
          Add-Content $Summary ""