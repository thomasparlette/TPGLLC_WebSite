name: Deploy Production Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_PATH: TPGLLC_WebSite/TPGLLC_WebSite.csproj
  PUBLISH_DIR: D:\Deploy\Artifacts\publish
  WEBSITE_DIR: D:\Websites\TPGLLC\Published
  BACKUP_DIR: D:\Deploy\Backups
  RELEASE_DIR: D:\Deploy\Releases
  LOG_DIR: D:\Deploy\Logs
  LOG_RETENTION_DAYS: 30
  BACKUP_RETENTION_DAYS: 30
  HEALTHCHECK_URL: http://localhost/health
  APP_POOL_NAME: TPGLLC

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Runner Info
        shell: powershell
        run: |
          hostname
          whoami
          git --version
          dotnet --info

      - name: Prepare Publish Folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:PUBLISH_DIR | Out-Null
          Remove-Item -Path (Join-Path $env:PUBLISH_DIR '*') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build and Publish
        shell: powershell
        run: |
          dotnet publish $env:PROJECT_PATH -c Release -o $env:PUBLISH_DIR

      - name: Deploy Website
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\Deploy\Scripts\Deploy.ps1" `
          -WebsitePath $env:WEBSITE_DIR `
          -PublishPath $env:PUBLISH_DIR `
          -BackupRoot $env:BACKUP_DIR `
          -ReleaseRoot $env:RELEASE_DIR `
          -LogRoot $env:LOG_DIR `
          -HealthCheckUrl $env:HEALTHCHECK_URL `
          -KeepReleases 10 `
          -LogRetentionDays $env:LOG_RETENTION_DAYS `
          -BackupRetentionDays $env:BACKUP_RETENTION_DAYS

      - name: Notify Deployment Result
        if: always()
        shell: powershell
        run: |
          $latestLog = Get-ChildItem $env:LOG_DIR -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -ne $latestLog) {
            $summary = Get-Content $latestLog.FullName -Tail 40 -ErrorAction SilentlyContinue
            Add-Content $env:GITHUB_STEP_SUMMARY "## Deployment Result"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "Latest log: `$($latestLog.FullName)`"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "```"
            $summary | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY $_ }
            Add-Content $env:GITHUB_STEP_SUMMARY "```"
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY "## Deployment Result"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "No deployment log found."
          }
